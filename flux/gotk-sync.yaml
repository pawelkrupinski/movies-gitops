# What Flux watches, and — more importantly — what it deliberately does NOT.
#
# ------------------------------------------------------------------------------------------------
# WHY FLUX AT ALL
# ------------------------------------------------------------------------------------------------
#
# Because config that is committed, reviewed and green does not reach this cluster. The deploy
# endpoint can only run `kubectl set image` (roles/k8s-deploy.nix: it "cannot run kubectl, and
# cannot name a resource"), so a ConfigMap, a resource limit or a JVM flag arrives only when
# somebody applies it by hand. On 2026-09-03 that cost an outage: web-us ran three hours at
# -Xmx768m with a merged, CI-green, `deployed-web`-tagged raise to 1024m sitting unapplied, and
# OOM-killed the public tier. Nothing was red at any point. The same gap bit twice more the same
# day, both times on changes written to close it.
#
# Reconciliation is the fix, not a better alarm: a controller that continuously compares the
# cluster to git makes that drift self-correcting instead of merely visible.
#
# ------------------------------------------------------------------------------------------------
# FLUX OWNS THE DEPLOYMENTS NOW, WHICH IT DID NOT AT FIRST
# ------------------------------------------------------------------------------------------------
#
# For its first day here, every app Kustomization below carried a `patches` entry stamping
# `kustomize.toolkit.fluxcd.io/reconcile: disabled` onto its Deployment. That was not squeamishness:
# the manifests said `image: ...:latest` and CI pinned a commit SHA over the top with
# `kubectl set image`, so a reconciler pointed at those paths would have won that fight every five
# minutes and reverted production to whatever `latest` happened to be, forever.
#
# What made the exclusion unnecessary was moving the pin INTO the repository. image-automation
# writes the winning tag straight into the base manifests (infra/kubernetes/image-automation/), so
# git and the cluster no longer disagree about what should be running and there is nothing left to
# fight over. `kubectl set image` is gone from main.yml, and with it the reason CI ever needed a
# credential that could change production.
#
# The exclusion had a real cost while it lasted, which is why it is worth recording that it is
# gone: a Deployment change — a probe, a resource limit, a rollout strategy — was reconciled by
# NOBODY. That is the same drift class as the ConfigMap gap that caused the 2026-09-03 outage,
# sitting unnoticed inside the fix for it.
#
# ⚠️ WHAT NOW STANDS BETWEEN A BROKEN DEPLOY AND SILENCE. A CI job that fails is loud. Four
# controllers that quietly stop are not, and the result is the cluster serving its last image
# indefinitely while every run stays green. So this switch was made only after Flux itself became
# watched: infra/kubernetes/flux-metrics/ publishes the controllers' metrics and
# nix/files/monitoring/rules/flux.rules alerts on a stalled deploy path, a suspended automation and
# a dead controller. Do not weaken one without the other.
#
# NOT SELF-MANAGED, deliberately. `flux bootstrap` would have Flux reconcile its own components
# from git, which is the usual arrangement and the right one later. For a first install it means a
# bad component version can break the thing that would have rolled it back, so gotk-components.yaml
# is applied by hand and upgrading Flux is a re-apply. Revisit at stage 3.
#
# NO GIT CREDENTIAL, because github.com/pawelkrupinski/movies is public. Nothing to rotate, nothing
# to leak, and the cluster holds no token that reaches the repository. If the repo is ever made
# private this file needs a `secretRef` and a read-only deploy key, and the reconciliation will
# fail loudly (not silently) in the meantime.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: movies
  namespace: flux-system
spec:
  # Five minutes: fast enough that a hand-applied hotfix is reverted-or-confirmed within one coffee,
  # slow enough that a public clone of a repository this size is not a background job.
  interval: 5m
  url: https://github.com/pawelkrupinski/movies
  ref:
    branch: main
  # Only the paths below are ever read; the ~18k files of Scala are ignored so the artifact the
  # source-controller keeps in memory stays small.
  ignore: |
    /*
    !/infra/kubernetes/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-state-metrics
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/kube-state-metrics
  # PRUNE ON. Flux deletes only what it created and still labels as its own, so this removes a
  # resource when its manifest leaves git — the half of reconciliation that a plain `apply` never
  # does, and the reason a deleted manifest currently leaves a live object behind.
  prune: true
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/headlamp
  prune: true
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/reloader
  prune: true
  wait: true
  timeout: 3m
---
# Flux's own metrics Services. Separate from image-automation for the same reason that one is
# separate from `flux/`: this is what makes the deploy path observable, and it has to be able to
# land, be reverted, or be reasoned about without touching the thing it observes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-metrics
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/flux-metrics
  prune: true
  wait: true
  timeout: 3m
---
# The image-automation objects get a Kustomization of their own rather than riding along in
# `./infra/kubernetes/flux`, because that directory also holds gotk-components.yaml -- pointing a
# reconciler at it would make Flux manage its own controllers, which this file's header
# deliberately does not do yet ("a bad component version can break the thing that would have rolled
# it back"). A separate directory keeps that choice intact while still letting the policies and the
# automation itself be reviewed and reverted like any other config.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/image-automation
  prune: true
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-pl-config
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/web/overlays/pl
  # PRUNE STAYS OFF. Flux owns the Deployment now, but these paths predate it, and a prune sweep
  # deleting something nobody remembered was here is a sharp edge with no matching gain.
  prune: false
  # WAIT IS ON, AND IT IS WHAT MAKES A BAD DEPLOY VISIBLE. With it, a rollout that never becomes
  # healthy leaves this Kustomization Ready=False, which flux.rules turns into an alert. Without
  # it Flux reports success the moment it has applied the object, so a crash-looping image would
  # be indistinguishable from a good one. The alert's `for: 30m` is what keeps an ordinary slow
  # rollout from paging.
  wait: true
  timeout: 3m
---
