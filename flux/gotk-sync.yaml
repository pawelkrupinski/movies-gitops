# What Flux watches, and — more importantly — what it deliberately does NOT.
#
# ------------------------------------------------------------------------------------------------
# WHY FLUX AT ALL
# ------------------------------------------------------------------------------------------------
#
# Because config that is committed, reviewed and green does not reach this cluster. The deploy
# endpoint can only run `kubectl set image` (roles/k8s-deploy.nix: it "cannot run kubectl, and
# cannot name a resource"), so a ConfigMap, a resource limit or a JVM flag arrives only when
# somebody applies it by hand. On 2026-09-03 that cost an outage: web-us ran three hours at
# -Xmx768m with a merged, CI-green, `deployed-web`-tagged raise to 1024m sitting unapplied, and
# OOM-killed the public tier. Nothing was red at any point. The same gap bit twice more the same
# day, both times on changes written to close it.
#
# Reconciliation is the fix, not a better alarm: a controller that continuously compares the
# cluster to git makes that drift self-correcting instead of merely visible.
#
# ------------------------------------------------------------------------------------------------
# ⚠️ WHY web AND worker ARE HERE WITH THEIR DEPLOYMENTS SWITCHED OFF
# ------------------------------------------------------------------------------------------------
#
# Their manifests say `image: ghcr.io/pawelkrupinski/movies-{web,worker}:latest`, and CI pins a
# commit SHA over the top with `kubectl set image`. Those two are already known to fight —
# infra/kubernetes/apply.sh exists solely to read the running image, apply, and put it back.
#
# Point a reconciler at those paths and it wins that fight every five minutes: production reverts
# to whatever `:latest` happens to be, with no record of which build that is, forever. That is
# strictly worse than the drift this exists to fix.
#
# The answer is NOT to keep those paths out — the ConfigMap is exactly what drifted, and leaving
# it unreconciled leaves the outage's cause in place. It is to reconcile the path and exclude the
# one object that conflicts: each app Kustomization below carries a `patches` entry stamping
# `kustomize.toolkit.fluxcd.io/reconcile: disabled` onto every Deployment, which tells
# kustomize-controller to skip that object entirely. Flux owns the ConfigMap and the Service; CI
# keeps the Deployment and its pinned image, exactly as today.
#
# WHY THIS AND NOT A MANIFEST SPLIT. Separating the ConfigMap into its own path was tried first
# and is worse: kustomize refuses to load a patch from outside its own root, so the split needs a
# second copy of each overlay's nameSuffix and labels, and a second place for the values to drift
# against. This annotation needs no structural change at all — `kustomize build` output for every
# overlay is byte-identical to before, which is the property that makes it safe to apply.
#
# ⚠️ A ConfigMap CHANGE DOES NOT RESTART PODS. Flux keeps the stored value correct; a running JVM
# picks it up at its next roll, which on this fleet is ~13 deploys a day. That shrinks the stale
# window from "until somebody notices" — three hours and an OOM, on 2026-09-03 — to "until the
# next deploy". It does not eliminate it. Closing the last gap means either letting Flux own the
# Deployment (blocked on retiring `set image`) or a restart-on-change controller.
#
# THE STAGE AFTER THIS: retire `set image` entirely. Flux's image-automation controllers watch the
# registry and commit the new tag to git, so the pin lives in the repository, one mechanism owns
# the cluster, and the annotation below comes off. That is the end state and the one that needs
# the most care, so it is not being done in the same change.
#
# NOT SELF-MANAGED, deliberately. `flux bootstrap` would have Flux reconcile its own components
# from git, which is the usual arrangement and the right one later. For a first install it means a
# bad component version can break the thing that would have rolled it back, so gotk-components.yaml
# is applied by hand and upgrading Flux is a re-apply. Revisit at stage 3.
#
# NO GIT CREDENTIAL, because github.com/pawelkrupinski/movies is public. Nothing to rotate, nothing
# to leak, and the cluster holds no token that reaches the repository. If the repo is ever made
# private this file needs a `secretRef` and a read-only deploy key, and the reconciliation will
# fail loudly (not silently) in the meantime.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: movies
  namespace: flux-system
spec:
  # Five minutes: fast enough that a hand-applied hotfix is reverted-or-confirmed within one coffee,
  # slow enough that a public clone of a repository this size is not a background job.
  interval: 5m
  url: https://github.com/pawelkrupinski/movies
  ref:
    branch: main
  # Only the paths below are ever read; the ~18k files of Scala are ignored so the artifact the
  # source-controller keeps in memory stays small.
  ignore: |
    /*
    !/infra/kubernetes/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-state-metrics
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/kube-state-metrics
  # PRUNE ON. Flux deletes only what it created and still labels as its own, so this removes a
  # resource when its manifest leaves git — the half of reconciliation that a plain `apply` never
  # does, and the reason a deleted manifest currently leaves a live object behind.
  prune: true
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/headlamp
  prune: true
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/reloader
  prune: true
  wait: true
  timeout: 3m
---
# Flux's own metrics Services. Separate from image-automation for the same reason that one is
# separate from `flux/`: this is what makes the deploy path observable, and it has to be able to
# land, be reverted, or be reasoned about without touching the thing it observes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-metrics
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/flux-metrics
  prune: true
  wait: true
  timeout: 3m
---
# The image-automation objects get a Kustomization of their own rather than riding along in
# `./infra/kubernetes/flux`, because that directory also holds gotk-components.yaml -- pointing a
# reconciler at it would make Flux manage its own controllers, which this file's header
# deliberately does not do yet ("a bad component version can break the thing that would have rolled
# it back"). A separate directory keeps that choice intact while still letting the policies and the
# automation itself be reviewed and reverted like any other config.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/image-automation
  prune: true
  wait: true
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-pl-config
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: movies
  path: ./infra/kubernetes/web/overlays/pl
  # PRUNE OFF for the app tiers. Everything here predates Flux and is co-owned with CI; a prune
  # sweep on a path whose Deployment is deliberately unmanaged is a sharp edge for no gain.
  prune: false
  wait: false
  timeout: 3m
  patches:
    # THE ONE OBJECT FLUX MUST NOT TOUCH. Without this it would write the manifest's
    # `image: ...:latest` over the SHA CI pinned, every interval, forever.
    - patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: not-used
          annotations:
            kustomize.toolkit.fluxcd.io/reconcile: disabled
      target:
        kind: Deployment
---
