# Headlamp: a Kubernetes UI for this cluster. Nodes, workloads, pod health, logs, events.
#
# ------------------------------------------------------------------------------------------------
# WHY THIS AND NOT ARGO CD, WHICH ALSO SHIPS A UI
# ------------------------------------------------------------------------------------------------
#
# Argo CD's UI is better -- its live-vs-desired diff is the thing this cluster most lacks -- and it
# does not fit. Measured 2026-09-03: k3s-worker-1 is at 81% CPU and 82% memory REQUESTED, and
# NodeMemoryBudgetSpec leaves 256Mi of ledger spare once the web tier's rolling surge pod is
# counted. Argo's five components want 1-2Gi. monitoring-1 has the room on paper and is the wrong
# box on purpose: it carries the control-plane taint, holds etcd, and runs Prometheus and Grafana
# as host services outside pod accounting -- so an OOM there takes out the control plane and the
# only view of the fleet together, which is precisely when it is needed.
#
# Headlamp is one container at 128Mi. It fits in the 512Mi system reserve that today holds only
# kube-state-metrics' 64Mi, so it costs the ledger nothing.
#
# ------------------------------------------------------------------------------------------------
# IT IS NOT PUBLISHED, AND THAT IS THE DEFAULT ON PURPOSE
# ------------------------------------------------------------------------------------------------
#
# PUBLISHED AT headlamp.kinowo.net, and only once it could authenticate its own users.
# roles/public-proxy.nix states the rule: "the proxy adds TLS and a name, not authentication",
# which is why Grafana was for a long time the only thing published. Headlamp now clears the same
# bar through Google OIDC, and clears it twice over: the consent screen is in TESTING mode, so
# only the accounts listed as test users on the Google project can authenticate AT ALL -- an
# allow-list Google enforces before a request ever reaches this pod.
#
# Reach it, today, with a port-forward over the same ssh tunnel that reaches the API:
#
#   ssh -fN -L 16443:127.0.0.1:6443 root@<monitoring-1>
#   kubectl -n monitoring port-forward svc/headlamp 8080:80     # then http://localhost:8080
#
# TO PUBLISH IT LATER, the decision to make first is authentication, not the vhost. Headlamp does
# not serve anonymously -- in-cluster it asks for a bearer token, so an exposed instance is not
# open. But a token prompt on the public internet is a credential-stuffing target and a token in a
# password manager is a credential that never rotates, so the answer is OIDC (this project already
# runs a Google client for the app) rather than the built-in prompt. Add the vhost in the same
# change as the OIDC config, never before it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: monitoring
  labels:
    app: headlamp
spec:
  replicas: 1
  # RECREATE, not RollingUpdate. A rolling update of a single-replica Deployment briefly wants two
  # pods, and on this node the spare is measured in hundreds of mebibytes reserved for the web
  # tier's own surge. A UI that is down for fifteen seconds during its own upgrade costs nothing;
  # a UI that makes a web rollout sit Pending costs the public tier.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      # monitoring-1 carries the control-plane taint and is not tolerated here, so this lands on
      # k3s-worker-1 by ordinary scheduling. Said rather than assumed, because "it happened to
      # schedule where I wanted" is not a placement decision.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
      containers:
        - name: headlamp
          # PINNED, not `latest`. No ImagePolicy selects upstream Headlamp releases, so the tag here
          # IS what runs and bumping it is an edit to this line. `latest` on a third-party image
          # would additionally mean a pod restarting onto a version nobody chose, with nothing
          # recording which.
          image: ghcr.io/headlamp-k8s/headlamp:v0.45.0
          args:
            - "-in-cluster"
            - "-plugins-dir=/headlamp/plugins"
            # EVERY API CALL IS NOW THE POD'S OWN, because no per-person token is left to carry
            # one. Headlamp's in-cluster context is otherwise built with an EMPTY AuthInfo and
            # simply forwards whatever `Authorization` header arrived; with OIDC gone that header
            # is never set and every panel would 401. This flag copies the mounted ServiceAccount
            # token onto the context (kubeconfig.go:1281) and CLEARS the incoming header before
            # proxying (headlamp.go:1978-1994).
            #
            # ⚠️ "unsafe" IS UPSTREAM'S NAME FOR IT AND IT IS EARNED. The backend answers with its
            # own credential rather than the caller's, so ANY caller reaching this pod gets the
            # ServiceAccount's read -- there is no second opinion inside the cluster. The Service
            # is a ClusterIP with no NetworkPolicy in front of it, so the ONLY gate is
            # `requireGoogleLogin` on the Caddy vhost. An unauthenticated request straight to the
            # ClusterIP used to answer 401; it is answered now. rbac.yaml bounds what that buys,
            # and `secrets` stays absent from it precisely because this is a shared identity.
            - "-unsafe-use-service-account-token"
          env:
            # NO OIDC HERE ANY MORE. Sign-in moved to the fleet's oauth2-proxy door
            # (`requireGoogleLogin` on headlamp.kinowo.net), so this instance authenticates nobody
            # itself and the API server no longer trusts Google as an issuer. The `headlamp-oidc`
            # Secret these variables used to read is now referenced by nothing.
            - name: HEADLAMP_CONFIG_BASE_URL
              value: ""

          ports:
            - name: http
              containerPort: 4466
          resources:
            requests:
              cpu: "25m"
              memory: 128Mi
            limits:
              # No CPU limit, matching the rest of this fleet: throttling a UI's render to save a
              # core it is not otherwise using trades latency for nothing.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: plugins
              mountPath: /headlamp/plugins
            # `readOnlyRootFilesystem` above is kept, so every path the process writes to has to be
            # a mount. Headlamp wants two beyond its plugin dir and says so by CRASHING on boot
            # rather than degrading: `mkdir /home/headlamp/.config: read-only file system` and
            # `Failed to create static dir: mkdir /tmp/.headlamp<n>`. Both are scratch -- config it
            # rewrites each start, and a temp dir for the unpacked frontend -- so they are emptyDirs
            # and not persistence.
            - name: config
              mountPath: /home/headlamp/.config
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        # `readOnlyRootFilesystem` above means the plugin directory has to be a writable mount even
        # when empty, or the container refuses to start.
        - name: plugins
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: monitoring
  labels:
    app: headlamp
spec:
  # ClusterIP, reached by Caddy on monitoring-1 -- which is a cluster NODE, so kube-proxy makes
  # this address routable from the host without publishing a NodePort on every node's interfaces.
  #
  # PINNED, not allocated. A Service deleted and recreated gets a different address out of the
  # 10.43.0.0/16 range, and the vhost in hosts/monitoring-1 names this one -- so an unpinned
  # address turns a routine `kubectl delete svc` into a 502 nobody connects to the cause.
  type: ClusterIP
  clusterIP: 10.43.165.84
  selector:
    app: headlamp
  ports:
    - name: http
      port: 80
      targetPort: http
