# Headlamp's identity, and the exact set of objects it may read.
#
# ------------------------------------------------------------------------------------------------
# THE GRANT IS THE INTERESTING PART OF THIS FILE, NOT THE DEPLOYMENT
# ------------------------------------------------------------------------------------------------
#
# Headlamp is a general Kubernetes UI, and upstream's manifest binds it to `cluster-admin` so that
# every button in it works. That is the wrong default here for the same reason kube-state-metrics
# does not get `secrets`: a UI reached over the network should not be a step towards the production
# Mongo credential, the scraper API keys or the Telegram bot token, all of which live in
# `kinowo/worker-*-secrets`, nor towards `kinowo/ghcr-pull`.
#
# So this is a READ-ONLY grant with `secrets` deliberately absent. `view` (the built-in ClusterRole)
# would have been the obvious shortcut and is NOT used: it is a moving target defined by the
# distribution rather than by this file, and on some versions it includes more than it reads like.
# Naming the resources here means the grant is auditable by reading one page.
#
# WHAT THAT COSTS, STATED PLAINLY so nobody reports it as a bug:
#
#   - No exec into a pod, no port-forward from the UI, no deleting or scaling anything.
#   - No editing YAML in the browser -- objects render, the Save button will fail.
#   - Secrets appear in listings by name only where the API includes them in owner references;
#     their VALUES are unreachable, which is the point.
#
# Everything the UI is actually wanted for -- which nodes exist, are they Ready, what is scheduled
# where, which pods are restarting, container logs, events -- is here. `pods/log` is the one grant
# that goes past plain object metadata, and it earns it: "why is this pod unhealthy" is unanswerable
# without it, and logs from these workloads carry no credential (the app redacts URL credentials --
# see services.RedactedUrl).
#
# TO MAKE IT A MANAGEMENT UI LATER is a deliberate second decision, not a tweak: bind a second,
# narrower Role for the verbs wanted (say `patch` on Deployments in `kinowo`) rather than widening
# this one to `*`. The blast radius of the single name in the subjects list below should stay
# legible -- and it matters more than it used to, because that name is now a SHARED identity
# rather than a person's: see the subjects block for what changed on 2026-09-07 and why.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: monitoring
  labels:
    app: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-read
  labels:
    app: headlamp
rules:
  # Core objects the cluster view is built from. `secrets` is absent by choice -- see the header.
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - endpoints
      - events
      - configmaps
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
      - serviceaccounts
      - limitranges
      - resourcequotas
    verbs: ["get", "list", "watch"]

  # Container logs. The one grant beyond object metadata, and the reason the UI is worth having.
  - apiGroups: [""]
    resources: ["pods/log", "pods/status", "nodes/status"]
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  # So the UI can say what THIS token may do, rather than rendering buttons that 403.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]

  # Present only if metrics-server is installed; harmless when the API group does not exist.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-read
  labels:
    app: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-read
subjects:
  # THE POD'S OWN IDENTITY, and since 2026-09-07 the ONLY identity Headlamp presents to the API
  # server. The backend runs with `-unsafe-use-service-account-token` (see deployment.yaml), so
  # every panel is answered with THIS name's read rather than with the token of whoever is looking.
  #
  # THAT MAKES IT A SHARED ROBOT, deliberately, and it is the entire reason the ClusterRole above
  # withholds `secrets` and every write verb. There is no per-person authorization left underneath
  # it: everyone admitted by the Google door at the proxy sees exactly what everyone else sees, and
  # the API server's audit log records this name, not a person's. The grant IS the bound.
  #
  # ⚠️ THIS SUBJECT WAS REMOVED ON 2026-09-07 AND PUT BACK THE SAME DAY, in opposite directions for
  # good reasons both times, so read before reverting either way:
  #
  #   - Removing it was right WHILE Headlamp did its own OIDC. The backend needed no identity of
  #     its own (one cosmetic `get configmaps kube-system/kubeadm-config`, which already failed on
  #     k3s), and the binding was the only thing making the mounted token a cluster-wide read
  #     credential -- measured: a pod running as this ServiceAccount pulled a full NamespaceList
  #     through Headlamp's own proxy, and 403'd once the subject was gone.
  #   - Putting it back is the price of unifying sign-in onto the oauth2-proxy door. With no OIDC
  #     there is no user token to forward, so without this the UI 401s every panel.
  #
  # ⚠️ WHAT THAT COSTS, SAID PLAINLY: an unauthenticated request straight to the ClusterIP used to
  # answer 401 and is ANSWERED now, because the backend falls back to this token when no
  # Authorization header arrives. The Service is a ClusterIP and no NetworkPolicy fronts it, so
  # every pod k3s schedules can read the cluster read-only without signing in to anything. The
  # Caddy vhost's `requireGoogleLogin` guards the PUBLIC path only. Restoring per-person identity
  # means restoring `fleet.k3sServer.oidc` first -- this binding alone cannot do it.
  #
  # docs/headlamp-serviceaccount-subject.md in the app repo carries the measurements behind both
  # halves.
  - kind: ServiceAccount
    name: headlamp
    namespace: monitoring

  # NO `User` SUBJECT ANY MORE. `oidc:pawel.krupinski@gmail.com` was named here until 2026-09-07 and
  # went with the API server's OIDC trust (`fleet.k3sServer.oidc`, deleted from
  # infra/nix/hosts/monitoring-1/default.nix). With no issuer trusted, no Google token can
  # authenticate as a Kubernetes subject at all, so the name would match nothing and reading it
  # here would suggest a per-person path that no longer exists.
  #
  # The allow-list that decides who gets in is now `fleet.googleSso.allowedEmails` on monitoring-1,
  # one layer out at the proxy, and it admits people to the UI rather than to Kubernetes.
