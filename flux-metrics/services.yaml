# MAKING FLUX WATCHABLE, which it was not for the first day it ran the deploys.
#
# ------------------------------------------------------------------------------------------------
# WHY THIS EXISTS
# ------------------------------------------------------------------------------------------------
#
# Deploys used to be a CI job. When they broke, a job went red -- loudly, in a list somebody reads.
# Now a deploy is four controllers agreeing: source-controller fetches the commit,
# image-reflector-controller scans the registry, image-automation-controller commits the winning
# tag, kustomize-controller applies it. Every one of those can stop without anything going red,
# because a Kubernetes custom resource going `Ready=False` is not an event anybody sees. The
# cluster would keep serving the last image it got, indefinitely, exactly as it did during the
# outage that put Flux here in the first place.
#
# So the deploy path had to become observable BEFORE `kubectl set image` was retired. Trading a red
# CI job for a silent NotReady condition would have been a downgrade wearing the costume of an
# upgrade.
#
# ------------------------------------------------------------------------------------------------
# WHY NodePort AND WHY THE PORTS ARE FIXED
# ------------------------------------------------------------------------------------------------
#
# Prometheus runs on monitoring-1, OUTSIDE the cluster, and scrapes literal `address:port` targets
# (there is no kubernetes_sd here and no prometheus-operator, so no PodMonitor). kube-state-metrics
# already solved this with a NodePort on a fixed number; this follows it exactly, including the
# reason the number is written down rather than allocated -- an allocated port changes on every
# re-apply and the scrape target on monitoring-1 does not.
#
# ⚠️ THESE FOUR NUMBERS MUST AGREE WITH `fleet.prometheus.fluxTargets` in
# infra/nix/modules/roles/prometheus.nix. The symptom of a disagreement is
# `TargetDown{job="flux"}`, which reads as Flux being broken rather than as a typo here.
#
# The controllers all serve metrics on their `http-prom` container port, 8080.
---
apiVersion: v1
kind: Service
metadata:
  name: source-controller-metrics
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  type: NodePort
  selector:
    app: source-controller
  ports:
    - name: http-prom
      port: 8080
      targetPort: http-prom
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: kustomize-controller-metrics
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  type: NodePort
  selector:
    app: kustomize-controller
  ports:
    - name: http-prom
      port: 8080
      targetPort: http-prom
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: image-reflector-controller-metrics
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  type: NodePort
  selector:
    app: image-reflector-controller
  ports:
    - name: http-prom
      port: 8080
      targetPort: http-prom
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: image-automation-controller-metrics
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: flux
spec:
  type: NodePort
  selector:
    app: image-automation-controller
  ports:
    - name: http-prom
      port: 8080
      targetPort: http-prom
      nodePort: 30084
---
# ⚠️ WITHOUT THIS, EVERY SERVICE ABOVE IS UNREACHABLE AND THE ALERTS WATCHING FLUX ARE THEMSELVES
# DOWN. Found the day they were added, by the alert that was supposed to be the safety net:
# `up{job="flux"}` was 0 on all four while the Services, their endpoints and kube-proxy's NodePort
# rules were all perfectly correct.
#
# The cause is a policy Flux ships in gotk-components.yaml. Its `allow-scraping` admits port 8080
# `from: [{namespaceSelector: {}}]` -- which reads as "anywhere" and means "any pod in any
# namespace IN THIS CLUSTER". Prometheus is not in this cluster: it runs on monitoring-1, outside,
# deliberately holding no kubeconfig. So every scrape was denied. kube-state-metrics is reachable
# only because the `monitoring` namespace has no NetworkPolicy at all -- an absence of rules,
# which is easy to mistake for a working pattern to copy.
#
# THIS IS AN ADDITION, NOT AN EDIT. NetworkPolicies union, so a second one granting what the first
# omits is the whole fix -- and editing Flux's own policy would be undone by the next
# `flux install` regeneration, silently, at an upgrade nobody would connect to this.
#
# BOTH CIDRs, and the second one is not laziness. NodePort traffic is masqueraded before it reaches
# the pod, and the source the policy actually sees depends on the path the kernel picks: the fleet
# subnet for traffic that arrives un-SNATed, or a pod-network address once kube-proxy has
# masqueraded it. Naming both is what makes this work regardless, and it grants nothing new --
# 10.42/16 is the pod network, which `allow-scraping` above already admits in full.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scraping-from-the-fleet
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The three Hetzner hosts on the private network, and nothing else -- the public interface
        # is not in this range, so this does not expose metrics to the internet.
        - ipBlock:
            cidr: 10.20.0.0/24
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - port: 8080
          protocol: TCP
