# COUNTRY-AGNOSTIC BASE for the WEB (serving) tier. Everything here is true of the PL, DE and UK
# web deployments alike; anything that differs lives in overlays/<country>/ and nowhere else.
#
# HOW THIS DIFFERS FROM THE WORKER, which is the sibling directory and otherwise the same shape:
#
#   KINOWO_COUNTRY    SINGULAR, not KINOWO_COUNTRIES. The two tiers name their country through
#                     different variables (see Country.soleFromEnv) and getting this wrong hands
#                     the process the Poland default -- an English site serving Polish cinemas.
#   no PVC            web is stateless. The worker's /data holds heap dumps, logs and an AppCDS
#                     archive; web keeps nothing across a restart.
#   RollingUpdate     the worker is `Recreate` because two of them would double-write one corpus.
#                     Web is read-only, so replicas are safe -- and this tier is the only thing
#                     users see, so a deploy must never take it fully down. maxUnavailable: 0
#                     means the new pod must pass its readiness probe BEFORE the old one goes.
#   readinessProbe    the worker has none: nothing routes to it. Here it is what makes the
#                     rolling update honest -- without it the Service starts sending traffic to a
#                     JVM that is still building its MovieCache, which is a ~30s window of 503s.
#
# ⚠️ NO LEADING `---` BELOW, ON PURPOSE. image-automation-controller rewrites this file when it
# deploys, through kustomize's YAML round-trip -- and that round-trip keeps comments ATTACHED TO A
# NODE while silently dropping any that float before the first document. With a `---` here, this
# whole header was a detached prefix rather than the first node's head comment, and the first two
# automated deploys deleted it outright (decff51a9 for the worker, f32d34f89 for web) with nothing
# red to say so. Removing the separator is what makes the header survive; do not put it back.
apiVersion: v1
kind: Namespace
metadata:
  name: kinowo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-env
  namespace: kinowo
data:
  PORT: '9000'
  # ONE ACCOUNT ACROSS EVERY COUNTRY.
  #
  # `models.Country.usersDbName` sends the `users` + `userStates` collections here
  # instead of to the pod's own per-country database, which is what makes a
  # visitor who signs in on one country the same person (same hidden films, same
  # /plan picks) on the next. The session cookie is already shared: `AppLoader`
  # leaves its path at the host root, so `/uk`, `/de`, `/us` and `/es` send it to each
  # other, and `AuthController.ssoStart` hands it across to kinowo.net.
  #
  # SETTING IT WAS A DATA CUTOVER, NOT A CONFIG FLIP, and the rows were folded in
  # FIRST: the four databases each held their own copy of the accounts made on
  # them, so pointing every pod at an empty database would have shown every
  # visitor a blank account. `tools.SharedUsersMigration` did that fold. It is
  # additive and left every source collection untouched, so this stays reversible
  # by deleting the key again, and it is re-runnable to sweep up anyone who signed
  # in on a country's own database during the window:
  #
  #   MONGODB_USERS_DB=kinowo sbt 'web/Test/runMain tools.SharedUsersMigration'          # dry run
  #   MONGODB_USERS_DB=kinowo sbt 'web/Test/runMain tools.SharedUsersMigration --write'
  #
  # WHY POLAND'S DATABASE AND NOT A DEDICATED `kinowo_users`. The obvious name was
  # tried first and every write failed `Unauthorized`: the deployments' Mongo user
  # is scoped to the four country databases, so a new one needs a grant on the
  # server before the app could read or write it. `kinowo` is a database every one of them
  # pods already hold rights on, and it is where 8 of the 11 account rows lived
  # anyway, so the fold was mostly a no-op there. Moving to a database of its own
  # later is this same variable plus that grant.
  MONGODB_USERS_DB: kinowo
  # Carried verbatim from fly.toml. G1 with a 384m heap is the known-good sizing: a pass at 192m
  # OOM-crash-looped once the MovieCache grew past a few cities, and the repeated JVM cold-starts
  # read as "high load" rather than as the OOM they were. Re-tuning it is a separate change from
  # moving the process.
  JAVA_OPTS: >-
    -Xms384m -Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:+UseStringDeduplication -XX:ReservedCodeCacheSize=96m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=64m -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/heapdumps -XX:ErrorFile=/data/logs/hs_err_%p.log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  annotations:
    # Restart this Deployment when a ConfigMap it reads actually changes — see
    # reloader/. Reloader has no global mode, so the opt-in is per
    # workload; here in the base so every country inherits it.
    reloader.stakater.com/auto: "true"
  namespace: kinowo
  labels:
    app: web
spec:
  replicas: 1
  # HOW LONG A NEW POD MUST STAY READY BEFORE ITS PREDECESSOR IS ALLOWED TO DIE.
  #
  # Without it `maxUnavailable: 0` is weaker than it looks: the old pod is retired the instant the
  # new one passes readiness ONCE, so a JVM that answers /health and then falls over takes the
  # country with it -- there is no replica left to serve. Thirty seconds is what the sibling
  # bitcashier fleet uses, and it is long enough to cover the window where this app is most
  # fragile: readiness passes when Play binds, while the MovieCache is still filling behind it.
  #
  # It makes deploys SLOWER, on purpose. All five countries roll in lockstep off one image line and
  # already serialise against the node's surge budget, so this adds ~30s per country to a roll that
  # takes ~150s. That trade is the right way round -- a slow deploy is invisible, a country that
  # 502s is the only thing users see.
  minReadySeconds: 30
  # The default is already 600, but a rollout that hangs Pending on this node is a REAL failure
  # mode (see NodeMemoryBudgetSpec), so the deadline that marks it as such is written down rather
  # than inherited.
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-1
      terminationGracePeriodSeconds: 30
      containers:
      - name: web
        # ⚠️ THIS LINE IS WRITTEN BY A MACHINE. The trailing marker makes it a kustomize
        # "setter": image-automation-controller finds the newest tag matching the
        # ImagePolicy named here and commits the change to this file, which is how a build
        # becomes a deploy (image-automation/automation.yaml). Editing the tag by
        # hand works and is the way to pin or roll back, but the automation will move it
        # forward again at its next run unless the ImageUpdateAutomation is suspended.
        #
        # NOT `latest`, ever: a pod restarting under a moving tag can come back on a
        # different build with nothing recording which. The value below is a real build.
        image: ghcr.io/pawelkrupinski/movies-web:main-20260909072037-d06373a # {"$imagepolicy": "flux-system:movies-web"}
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: web-env
        - secretRef:
            name: web-secrets
        ports:
        - name: http
          containerPort: 9000
        resources:
          requests:
            cpu: '500m'
            memory: 1Gi
          limits:
            # The limit is the OOM CEILING, at or above the request the scheduler reserves -- and
            # this was never Guaranteed QoS whatever an earlier note here claimed. There is
            # deliberately NO CPU limit (same reasoning as the worker: CFS quota stalls a JVM
            # mid-GC far worse than the limit saves), and a container without one is Burstable
            # however its memory is written, so eviction safety comes from the request sitting
            # above the measured peak instead. `NodeMemoryBudgetSpec` holds that bound.
            memory: 1Gi
        # Boot is slow (Play start + the MovieCache rehydrate), so the slow start gets its own
        # probe rather than a lenient liveness threshold that would also excuse a wedged process.
        #
        # `/health` WITH NO COUNTRY PREFIX, on every overlay including the three that serve under
        # one (`showtimes.cc/uk/...`). The kubelet talks to the pod's own address, never through
        # Caddy, so it never carries the prefix -- and `modules.AppLoader.rootOperationalRoutes`
        # keeps `/health` and `/metrics` answering at the root wherever the app is mounted, exactly
        # so this stays one path for all five. Do not "fix" this to /uk/health.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 4
        # THE FIX FOR THE 502s A DEPLOY USED TO EMIT. Measured 2026-09-08: a single `web-de`
        # rollout returned three 502s over 330ms through Caddy, on a tier whose whole point is
        # that users never see it move.
        #
        # Deleting a pod starts TWO things at once and orders neither. The kubelet sends SIGTERM,
        # and -- independently -- the endpoints controller drops the pod from the Service, which
        # only becomes real once kube-proxy has rewritten this node's iptables. Play begins
        # unbinding on the first while the second is still in flight, so for a moment the NodePort
        # still forwards to a socket that has stopped accepting. Caddy fronts these NodePorts with
        # a bare `reverse_proxy` and no retry, so each of those lands on a person as a 502.
        #
        # `sleep` does nothing except not exit: the container keeps serving normally throughout,
        # and SIGTERM is not sent until the hook returns. That is the entire mechanism -- it buys
        # the endpoint removal time to propagate before shutdown starts. 15s is the sibling
        # bitcashier fleet's value, and it fits inside the 30s grace period below with room for
        # Play's own shutdown.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "15"]
        volumeMounts:
        - name: data
          mountPath: /data
      # SCRATCH, not durable — deliberately an emptyDir and not the workers' PVC.
      # An OOM here restarts the CONTAINER, not the pod, and an emptyDir outlives
      # a container restart, so the dump written on the way down is still there to
      # read afterwards. It is lost when the pod is replaced, which is the right
      # trade for forensics nobody wants to pay a per-pod volume for: web-us OOMed
      # on 2026-09-03 and left NOTHING behind, because the web tier had no dump
      # flags and nowhere to put a dump if it had.
      #
      # Bounded on both sides: the image keeps exactly one dump and only while it fits in
      # half the volume, and `sizeLimit` caps the volume itself.
      volumes:
      - name: data
        emptyDir:
          # A CEILING, NOT A RESERVATION — nothing is consumed until an OOM writes a dump.
          # Sized against the 384m heaps this base serves (a dump is roughly the live set, so
          # ~150MiB), with room for the one being written beside the one being kept. web-us
          # runs a 1024m heap and raises this in its own overlay.
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kinowo
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - name: http
    port: 9000
    targetPort: http
---
# WHAT A NODE DRAIN IS ALLOWED TO DO TO A COUNTRY.
#
# Everything above governs a ROLLOUT, which the Deployment controller drives and which
# `maxUnavailable: 0` already makes safe. A drain is the other path to the same pod and obeys none
# of it: `kubectl drain`, a node cordoned for a host move, or the kubelet evicting under pressure
# all delete pods directly, and without a budget the API server has nothing to weigh them against.
#
# `maxUnavailable: 1` RATHER THAN `minAvailable: 1`, which is the choice that matters here. These
# Deployments run a single replica on purpose -- Prometheus scrapes the tier through its NodePort,
# and a second pod would have kube-proxy alternating between two independent sets of counters, so
# every kinowo_web_* alert would see phantom resets (see overlays/pl/patch.yaml). `minAvailable: 1`
# against one replica means the budget can NEVER be satisfied, so a drain blocks forever and a host
# move needs `--disable-eviction` to get past it -- trading a brief outage for a stuck one.
#
# So be honest about what this buys today: at one replica `maxUnavailable: 1` permits the eviction
# it describes, and is not a guard. It is the correct expression of the intent, it makes the
# drained-pod path explicit where nothing named it before, and it starts doing real work the moment
# any country runs two. The thing that actually protects a drain is the preStop hook above, which
# applies however the pod is deleted.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: kinowo
  labels:
    app: web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: web
