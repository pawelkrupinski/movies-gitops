# The Germany web deployment -- de.showtimes.cc.
#
# EVERYTHING ELSE COMES FROM ../../base. If you find yourself copying a field here that is not
# genuinely country-specific, it belongs in the base instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kinowo

resources:
  - ../../base

# web -> web-de, web-env -> web-env-de, and so on.
nameSuffix: -de

# So `kubectl -n kinowo get pods -l country=de` works, and so the three are distinguishable by
# pod label as well as by name.
labels:
  - pairs:
      country: de
    includeSelectors: true

patches:
  - path: patch.yaml
