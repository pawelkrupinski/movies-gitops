# THE COUNTRY'S OWN VALUES. See overlays/pl/patch.yaml for why every document repeats the namespace,
# and why this stays at ONE replica.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-env
  namespace: kinowo
data:
  # Serves the US repertoire: English UI, the kinowo_us database, the US state/territory list,
  # rendering the same `web` binary as the Polish site. SINGULAR -- the worker's variable is
  # KINOWO_COUNTRIES.
  KINOWO_COUNTRY: "us"
  # HEAP: 1024m, against the base's 384m, and the US is the only country that needs it.
  #
  # The base sizing assumes a page is bounded by "one city's films", which holds for
  # a Polish city or a UK county but NOT for a US state: California is ONE city with
  # 486 venues, and its rendered page is 18.9 MB (1.06 MB gzipped) against Poznan's
  # 2.0 MB. Rendering that inside a 384m heap OOM-killed this pod repeatedly on
  # 2026-08-30 -- `OutOfMemoryError: Java heap space`, and because
  # `pekko.jvm-exit-on-fatal-error` is on, the JVM exits rather than limping, so the
  # symptom users see is a 502 while the container restarts.
  #
  # 768m BOUGHT TIME, NOT ROOM. Measured over the 5 days Prometheus has held since
  # the 2026-08-29 cutover, G1 Old Gen on this pod peaks at 760.5 MiB against the
  # 768 MiB cap -- 99% of the whole heap is LIVE tenured data, leaving nothing for
  # young-gen allocation, and it averages 526.8 MiB (68.6%) even at rest. Every other
  # web pod's old gen sits at 40-94% of a 384m cap. Meanwhile RSS peaks at 1515 MiB
  # of the 2048 MiB limit, so 533 MiB of the container was being paid for and never
  # reached: the heap was the binding constraint, exactly as it was for worker-us on
  # 2026-09-03. 1024m takes the old-gen peak to ~74% and RSS to ~1771 MiB (86% of the
  # limit) -- headroom, no longer generous, and the request is untouched so the node
  # budget is unchanged.
  #
  # A cheaper fix exists and is NOT done here: a heap dump of worker-us showed 66.7%
  # of all String payload is duplicate (5,874,828 byte[] holding 1,956,716 distinct
  # values -- 'action' x66,106, 'PG-13' x30,315, '2D' x21,224), worth ~257 MiB to an
  # intern cache over the genre/rating/format/cast vocabularies. That would help both
  # tiers and every country, and could give this heap back.
  #
  # Everything else is the base's string verbatim; a ConfigMap patch replaces the
  # whole key, so it has to be restated rather than appended to. Non-heap is
  # unchanged (160m metaspace + 96m code cache + 64m direct), which is what sets the
  # 2Gi limit below: 1024 + 320 + JVM overhead sits inside it.
  JAVA_OPTS: >-
    -Xms1024m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:+UseStringDeduplication -XX:ReservedCodeCacheSize=96m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=64m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kinowo
spec:
  # ONE REPLICA, for the monitoring reason spelled out in overlays/pl/patch.yaml: Prometheus
  # scrapes this tier through the NodePort, so a second pod behind it would have kube-proxy
  # alternating between two independent sets of counters and every kinowo_web_* alert would see
  # phantom resets.
  replicas: 1
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              # CPU as UK and DE: half Poland's.
              #
              # MEMORY IS THE US EXCEPTION -- 2Gi, not the base 1Gi. The note that used to sit
              # here said the big roster was "a WORKER-side cost" because "the web tier serves
              # one city at a time and its MovieCache is sized by films on screen, not by venues
              # scraped". That is true of every country except this one: a US city IS a state,
              # so California alone carries 486 venues and renders an 18.9 MB page, and the pod
              # OOM-died serving it (2026-08-30). Sized to hold the 768m heap set above plus
              # ~320m of non-heap with room to spare.
              #
              # Revisit once a state's page is split per metro (/:city/:area/) -- that removes
              # the reason this number is high, and it should come back down to the base.
              # MEASURED, not guessed. Every pod on this node used to reserve a round
              # number -- a whole core per worker, 500m per web -- and the sum reached 97% of the
              # node's 8 allocatable cores while the box itself idled at 16%. The scheduler admits
              # on REQUESTS, so that left 240m free and no room for the extra pod a rolling update
              # surges: web-es sat Pending and Spain served the wrong image until its old pod was
              # deleted by hand. These numbers come from `max_over_time` of each pod's own
              # `process_cpu_seconds_total` over 24h. `NodeCpuBudgetSpec` holds the sum.
              # us web peaked at 0.59 cores -- it renders whole STATES, and California
              # alone is 486 venues in one 18.9 MB page. Revisit once a state's page is split per
              # metro (/:city/:area/); that is what makes this the largest web request.
              cpu: "750m"
              memory: 2Gi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kinowo
spec:
  ports:
    - name: http
      port: 9000
      targetPort: http
      # Fixed -- named by the showtimes.cc/us/* path handler in the host's Caddy config and by Prometheus.
      # 30910/30911/30912 are pl/de/uk, so this is the next free one.
      nodePort: 30913
