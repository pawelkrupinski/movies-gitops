# THE COUNTRY'S OWN VALUES. See overlays/pl/patch.yaml for why every document repeats the namespace.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-env
  namespace: kinowo
data:
  # Serves the UK repertoire: English UI, the kinowo_uk database, the UK city list, rendering the
  # same `web` binary as the Polish site. It also decides where the deployment is MOUNTED --
  # `models.Country.mountPath` turns this into `play.http.context` = "/uk/", which is what makes
  # every URL this pod emits start with the country segment it is proxied under. There is no
  # separate path setting to keep in step.
  KINOWO_COUNTRY: "uk"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kinowo
spec:
  template:
    spec:
      containers:
        - name: web
          resources:
            requests:
              # MEASURED, not guessed. Every pod on this node used to reserve a round
              # number -- a whole core per worker, 500m per web -- and the sum reached 97% of the
              # node's 8 allocatable cores while the box itself idled at 16%. The scheduler admits
              # on REQUESTS, so that left 240m free and no room for the extra pod a rolling update
              # surges: web-es sat Pending and Spain served the wrong image until its old pod was
              # deleted by hand. These numbers come from `max_over_time` of each pod's own
              # `process_cpu_seconds_total` over 24h. `NodeCpuBudgetSpec` holds the sum.
              # uk web peaked at 0.33 cores. Memory stays at Poland's 1Gi deliberately
              # rather than trimmed to match -- the heap sizing in the base is the one proven not
              # to OOM, and rediscovering that limit on a live site is not worth the 256Mi.
              cpu: "400m"
              memory: 1Gi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kinowo
spec:
  ports:
    - name: http
      port: 9000
      targetPort: http
      # Fixed -- named by the showtimes.cc/uk/* path handler in the host's Caddy config and by the
      # Prometheus scrape config. An allocated port would change on re-create and take the public
      # site down with it. See infra/nix/hosts/k3s-worker-1/default.nix.
      nodePort: 30912
