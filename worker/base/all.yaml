# COUNTRY-AGNOSTIC BASE. Everything here is true of the PL, DE and UK workers alike; anything
# that differs between them lives in overlays/<country>/ and nowhere else.
#
# WHAT DELIBERATELY IS NOT HERE, because getting it wrong merges three corpora into one:
#
#   KINOWO_COUNTRIES  the ONE value that distinguishes the three, and also what picks the
#                     database -- Country.mongoDb derives the name from the country. Which is
#                     why MONGODB_DB IS NEVER SET ANYWHERE, in the base or an overlay: setting
#                     it would pin every country to a single database.
#   the scrape levers KINOWO_SCRAPE_FRESHNESS_MINUTES and KINOWO_SCRAPE_TASKS_PER_VENUE are the
#                     dominant write-rate controls and the three corpora are not alike. The
#                     values in the overlays are carried from the Fly deployment, where they
#                     were arrived at against real load rather than guessed.
#   JAVA_OPTS         DE runs a 640m heap against PL and UK's 448m, for a larger corpus.
#   nodePort          one fixed port each, because prometheus.yaml names them.
#
# ⚠️ NO LEADING `---` BELOW, ON PURPOSE. image-automation-controller rewrites this file when it
# deploys, through kustomize's YAML round-trip -- and that round-trip keeps comments ATTACHED TO A
# NODE while silently dropping any that float before the first document. With a `---` here, this
# whole header was a detached prefix rather than the first node's head comment, and the first two
# automated deploys deleted it outright (decff51a9 for the worker, f32d34f89 for web) with nothing
# red to say so. Removing the separator is what makes the header survive; do not put it back.
apiVersion: v1
kind: Namespace
metadata:
  name: kinowo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-env
  namespace: kinowo
data:
  PORT: '9000'
  KINOWO_BOOT_HYDRATE_MAX_ATTEMPTS: '20'
  KINOWO_WORKER_POOL_SIZE: '4'
  MALLOC_ARENA_MAX: '2'
  MALLOC_TRIM_THRESHOLD_: '131072'
  KINOWO_LOG_DIR: /data/logs
  # The per-country disk budget for the share cards under /share-cards (see the volume below);
  # the worker prunes non-current cards oldest-first to stay under it.
  KINOWO_SHARE_CARD_BUDGET_MB: '1024'
  # The worker's own Telegram alerts (Filmweb fallback enter/recover, Filmweb drops, staging stuck)
  # go to the "Kinowo Monitoring" group; without these the alerters are wired OFF. Lost when the
  # workers left Fly (movies 7beff659b). TELEGRAM_BOT_TOKEN comes from worker-secrets.
  KINOWO_FALLBACK_TG_CHAT_ID: '-1003950886618'
  KINOWO_FALLBACK_TG_TOPIC_ID: '2'
  KINOWO_FILMWEB_DROP_TG_CHAT_ID: '-1003950886618'
  KINOWO_FILMWEB_DROP_TG_TOPIC_ID: '5'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-data
  namespace: kinowo
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  annotations:
    # Restart this Deployment when a ConfigMap it reads actually changes — see
    # reloader/. Reloader has no global mode, so the opt-in is per
    # workload; here in the base so every country inherits it.
    reloader.stakater.com/auto: "true"
  namespace: kinowo
  labels:
    app: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-1
      terminationGracePeriodSeconds: 30
      containers:
      - name: worker
        # ⚠️ THIS LINE IS WRITTEN BY A MACHINE. The trailing marker makes it a kustomize
        # "setter": image-automation-controller finds the newest tag matching the
        # ImagePolicy named here and commits the change to this file, which is how a build
        # becomes a deploy (image-automation/automation.yaml). Editing the tag by
        # hand works and is the way to pin or roll back, but the automation will move it
        # forward again at its next run unless the ImageUpdateAutomation is suspended.
        #
        # NOT `latest`, ever: a pod restarting under a moving tag can come back on a
        # different build with nothing recording which. The value below is a real build.
        image: ghcr.io/pawelkrupinski/movies-worker:main-20260925112732-2d22ca5 # {"$imagepolicy": "flux-system:movies-worker"}
        imagePullPolicy: IfNotPresent
        # WHICH DIRECTORY OF THE NODE'S HEAP-DUMP HOSTPATH THIS POD WRITES TO -- see the `heapdumps`
        # volume below. Read off the pod's own labels (the overlay adds `country`), so the base
        # names no country and every overlay gets its own directory without a patch.
        env:
        - name: POD_APP_LABEL
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: POD_COUNTRY_LABEL
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['country']
        # THE FACEBOOK APP CREDENTIALS, for the worker's re-scrape of a film page after its share
        # card changes (so a link pasted into Facebook/WhatsApp picks up the new og:image). Two
        # keys picked out of `web-secrets` -- the web pods' Secret, managed outside this repo --
        # rather than the whole Secret mounted, so the worker gains these two values and nothing
        # else of the web's. Unsuffixed on purpose: it is not a resource here, so kustomize's
        # nameSuffix leaves the reference alone and every country reads the one Secret.
        # `optional: true` so a missing Secret or key only disables the re-scrape; it never keeps
        # the worker from starting.
        - name: FACEBOOK_APP_ID
          valueFrom:
            secretKeyRef:
              name: web-secrets
              key: FACEBOOK_APP_ID
              optional: true
        - name: FACEBOOK_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: web-secrets
              key: FACEBOOK_APP_SECRET
              optional: true
        envFrom:
        - configMapRef:
            name: worker-env
        - secretRef:
            name: worker-secrets
        ports:
        - name: health
          containerPort: 9000
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /health
            port: health
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: health
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 4
        volumeMounts:
        - name: data
          mountPath: /data
        - name: heapdumps
          mountPath: /data/heapdumps
          subPathExpr: $(POD_APP_LABEL)-$(POD_COUNTRY_LABEL)
        # THE SHARE CARDS, written here and served by Caddy on the node straight off the host
        # directory (/share-cards/<cc>/<file> on every public vhost; see public-proxy.nix in the
        # app repo). One directory per country, picked by the pod's `country` label the same way
        # as the heap dumps above -- that label is the overlay's KINOWO_COUNTRIES value and the
        # `<cc>` segment of the public URL, so no overlay restates the path.
        #
        # SHARED BY EVERY REPLICA OF A COUNTRY, deliberately: cards are content-addressed and
        # written tmp-then-rename, so two workers rendering the same card write the same bytes and
        # the rename is atomic. That holds because they are all on ONE node (the nodeSelector
        # above). A second node would get its own empty hostPath that its Caddy never sees -- a
        # multi-node worker needs shared storage (RWX) here instead, and Caddy moved with it.
        # Every replica runs as root (the image sets no USER), which is the owner of the
        # directory, so any replica may write; see hosts/k3s-worker-1 in the app repo.
        - name: share-cards
          mountPath: /share-cards
          subPathExpr: $(POD_COUNTRY_LABEL)
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: worker-data
      # HEAP DUMPS OUTLIVE THE POD: a hostPath on k3s-worker-1, the node every kinowo pod is pinned
      # to, one directory per app-country (/var/lib/kinowo/heapdumps/web-pl/, .../worker-us/, via
      # subPathExpr above). web-pl heap-OOMed on 2026-09-23 with its dump on an emptyDir, and the
      # dump went with the pod. A hostPath rather than a PVC per app-country: one place to fetch
      # from, and one directory tree the node-side budget can see whole.
      #
      # BOUNDED TWICE, oldest deleted first, never a dump still being written: the image prunes
      # its own directory before each JVM start, and the node's `kinowo-heap-dumps` timer holds
      # 3 dumps / 4 GiB per app-country and 16 GiB in total every 15 minutes. Both run the one
      # script, infra/nix/files/heap-dumps.sh in the app repo; its runbook is docs/heap-dumps.md.
      # The path must match `fleet.heapDumps.root` in infra/nix/modules/fleet/heap-dumps.nix.
      - name: heapdumps
        hostPath:
          path: /var/lib/kinowo/heapdumps
          type: DirectoryOrCreate
      # The share-card parent; hosts/k3s-worker-1 in the app repo owns it, and the kubelet creates
      # each country's directory under it on first mount (subPathExpr above).
      - name: share-cards
        hostPath:
          path: /var/lib/kinowo/share-cards
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kinowo
  labels:
    app: worker
spec:
  type: NodePort
  selector:
    app: worker
  ports:
  - name: health
    port: 9000
    targetPort: health
