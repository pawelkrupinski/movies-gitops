# THE COUNTRY'S OWN VALUES. Four things differ between the three workers and they are all here.
#
# EVERY DOCUMENT CARRIES `namespace: kinowo`, and it is not decoration: the base sets that
# namespace, so a patch without it matches nothing and kustomize fails with
# "no resource matches strategic merge patch ... [noNs]" -- which reads like the resource is
# missing rather than like the selector is under-specified.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-env
  namespace: kinowo
data:
  # THE ONE VALUE THAT MAKES THIS THE UNITED KINGDOM WORKER, and also what selects the
  # database: Country.mongoDb derives it from the country, so this alone sends writes to the right
  # corpus. MONGODB_DB is never set -- it would override that and merge all three.
  KINOWO_COUNTRIES: "uk"

  # The identity model's paced TMDB lookup fill: every 30 minutes it re-asks aged searches, applies
  # TMDB's change lists and asks any question still open, at most this many a minute (halving on
  # 429/5xx). 300/min: 5 req/s per worker, 25 across the five — half TMDB's ~50 req/s.
  KINOWO_IDENTITY_SHADOW_LOOKUP_RATE: "300"

  # The dominant write-rate lever: how stale a cinema's scrape may get before it is re-scraped.
  KINOWO_SCRAPE_TASKS_PER_VENUE: "36"
  KINOWO_SCRAPE_FRESHNESS_MINUTES: "420"

  # Identical to the other countries except the heap. Carried from Fly verbatim: SerialGC and a
  # small pinned heap were the fix for an OOM-restart loop under G1, and re-tuning them is a
  # separate change from moving the process.
  # 512m since 2026-09-29 16:30 UTC (448m -> 640m that morning, when the identity model's take-up
  # ran the 448m heap at 419-438m and SerialGC took 75-87% of wall time). The day's memory work cut
  # UK's old gen after GC 349 -> 232 MB peak THROUGH a full rebuild (15:52 UTC: resolves 44 s, full
  # GC <=1% of wall time), so 512m's ~341 MB old gen runs at ~68% at the heaviest moment.
  # -Xmn100m since 2026-10-07: the default third (170 MB young) left the old gen 341 MB over a
  # 268 MB median live set (p90 287), so every boot and every heavy tick ran back-to-back full
  # collections — 11 a hour, 16.2 s/h, against 13.8 s/h for 244 young ones (24 h to 12:30 UTC).
  # 100 MB young gives the old gen 412 MB, twice the headroom.
  # 512m -> 640m (-Xmn160m, old 480) the same evening: back to the heap UK ran until 2026-09-29, whose
  # 1073 MiB RSS peak the request was measured against — the GC on 512m was the cost of the cut.
  JAVA_OPTS: >-
    -Xms640m -Xmx640m -Xmn160m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=96m -XX:CICompilerCount=2 -XX:-UseTypeSpeculation -XX:PerMethodRecompilationCutoff=20 -XX:PerBytecodeRecompilationCutoff=20 -XX:NativeMemoryTracking=summary -XX:+UnlockDiagnosticVMOptions -XX:+PrintNMTStatistics -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/heapdumps -XX:ErrorFile=/data/logs/hs_err_%p.log -Djdk.http.auth.tunneling.disabledSchemes=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kinowo
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              # MEASURED, not guessed. Every pod on this node used to reserve a round
              # number -- a whole core per worker, 500m per web -- and the sum reached 97% of the
              # node's 8 allocatable cores while the box itself idled at 16%. The scheduler admits
              # on REQUESTS, so that left 240m free and no room for the extra pod a rolling update
              # surges: web-es sat Pending and Spain served the wrong image until its old pod was
              # deleted by hand. These numbers come from `max_over_time` of each pod's own
              # `process_cpu_seconds_total` over 24h. `NodeCpuBudgetSpec` holds the sum.
              # uk worker peaked at 0.78 cores -- 500 paced Flicks venues at ~36
              # requests each, the second-heaviest sweep in the fleet.
              cpu: "1000m"
              # MEMORY IS MEASURED THE SAME WAY. `max_over_time(process_resident_memory_bytes[7d])`
              # put worker uk at 781Mi on 2026-09-07; this sits above that peak with headroom
              # rather than at the round worker default, which reserved surge budget it never
              # touched. The limit below is unchanged -- only the SCHEDULER's number moves.
              # 1280Mi since 2026-09-29 (DE's shape): the heap went 448m -> 640m, and RSS had peaked
              # at 929Mi on the 448m heap. Node requests 12.9Gi of 15.2Gi, with room for US's 2Gi surge.
              memory: 1280Mi
            limits:
              # The limit is the OOM CEILING; the request above is what the SCHEDULER reserves.
              # They are no longer equal, and this was never Guaranteed QoS whatever an earlier
              # note here claimed: there is deliberately NO CPU limit -- a CPU limit is CFS quota,
              # and a JVM whose GC or JIT threads are suspended mid-slice stalls far worse than
              # the limit saves -- and a container without one is Burstable however its memory is
              # written. So eviction safety comes from the REQUEST SITTING ABOVE THE MEASURED
              # PEAK, not from the limit matching it: the kubelet ranks Burstable pods by how far
              # past their own request they have gone. `NodeMemoryBudgetSpec` holds both bounds.
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kinowo
spec:
  ports:
    - name: health
      port: 9000
      targetPort: health
      # A FIXED PORT, because infra/nix/files/monitoring/scrape-kinowo-apps.yaml names it. An
      # allocated one would change on re-create and the scrape would silently go stale.
      nodePort: 30902
