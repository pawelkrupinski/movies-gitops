# THE COUNTRY'S OWN VALUES. Four things differ between the workers and they are all here.
#
# EVERY DOCUMENT CARRIES `namespace: kinowo`, and it is not decoration: the base sets that
# namespace, so a patch without it matches nothing and kustomize fails with
# "no resource matches strategic merge patch ... [noNs]" -- which reads like the resource is
# missing rather than like the selector is under-specified.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-env
  namespace: kinowo
data:
  # THE ONE VALUE THAT MAKES THIS THE UNITED STATES WORKER, and also what selects the
  # database: Country.mongoDb derives it from the country, so this alone sends writes to the right
  # corpus. MONGODB_DB is never set -- it would override that and merge every country.
  KINOWO_COUNTRIES: "us"

  # THE TWO SCRAPE-RATE LEVERS, AND THEY ARE COUPLED -- retune them together, never one alone.
  # WorkerScrapeCadenceConfigSpec locks the pair and will fail if they drift apart.
  #
  # TASKS_PER_VENUE = 36, the same as the UK's, because it is a property of the CLIENT rather than
  # of the country: a Flicks venue costs one programme page plus one day-chunk per advertised day,
  # and the UK measured ~34.9 advertised days per venue on prod. Without it the reaper admits
  # venues by COUNT and only discovers the fan-out once the planners run, which is the burst that
  # floors CPU.
  #
  # FRESHNESS = 840min (14h), NOT the UK's 420. www.flicks.us gets its own 200ms HostPolicies row
  # (`flicks.us` does not match `flicks.co.uk` -- rows match by host SUFFIX), and that pace is a
  # ceiling rather than a choice: the origin throttles per zone by STALLING connections, and its
  # throughput plateaus at ~3-5 req/s no matter the concurrency, so no shorter interval buys
  # throughput. The sweep is therefore ~5,000 venues x 36 requests x 200ms = ~10h, and 840 clears
  # it with ~28% headroom. WorkerScrapeCadenceConfigSpec computes both from the live roster and
  # prints the margin, so the number to trust is the one that run reports, not this sentence.
  #
  # THE HEADROOM IS THE POINT, not slack to be reclaimed. The UK tried an hourly cadence on
  # 2026-07-28 that made its sweep exactly fill its window: a pacer at a 100% duty cycle, a
  # sustained flat load against one third-party origin, and a worker that never idles. It was
  # reverted the same day. If US listings ever need to be fresher, cut the per-sweep request count
  # first -- the pace has nowhere to go.
  KINOWO_SCRAPE_TASKS_PER_VENUE: "36"
  KINOWO_SCRAPE_FRESHNESS_MINUTES: "840"

  # Identical to the other countries except the heap, which is the largest in the fleet: DE needed
  # 640m for 1,529 venues and this roster is ~3x that, so the scrape queue, the freshness store
  # and the corpus of live slots all scale with it. 1024m + ~290 MB non-heap leaves headroom
  # inside the 2Gi below. SerialGC and a pinned heap are carried from Fly verbatim -- they were the
  # fix for an OOM-restart loop under G1, and re-tuning them is a separate change from adding a
  # country.
  JAVA_OPTS: >-
    -Xms1024m -Xmx1024m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=96m -XX:CICompilerCount=2 -XX:-UseTypeSpeculation -XX:PerMethodRecompilationCutoff=20 -XX:PerBytecodeRecompilationCutoff=20 -XX:+AutoCreateSharedArchive -XX:SharedArchiveFile=/data/app.jsa -XX:NativeMemoryTracking=summary -XX:+UnlockDiagnosticVMOptions -XX:+PrintNMTStatistics -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/heapdumps -XX:ErrorFile=/data/logs/hs_err_%p.log -Djdk.http.auth.tunneling.disabledSchemes=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kinowo
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              # MEASURED, not guessed. Every pod on this node used to reserve a round
              # number -- a whole core per worker, 500m per web -- and the sum reached 97% of the
              # node's 8 allocatable cores while the box itself idled at 16%. The scheduler admits
              # on REQUESTS, so that left 240m free and no room for the extra pod a rolling update
              # surges: web-es sat Pending and Spain served the wrong image until its old pod was
              # deleted by hand. These numbers come from `max_over_time` of each pod's own
              # `process_cpu_seconds_total` over 24h. `NodeCpuBudgetSpec` holds the sum.
              # us worker peaked at 1.24 cores, the ONLY one that genuinely needs a
              # whole core and then some: ~5,000 Flicks venues.
              cpu: "1500m"
              memory: 2Gi
            limits:
              # Memory limit EQUALS the request (Guaranteed QoS, so the kubelet does not evict this
              # ahead of anything else) and there is deliberately NO CPU limit: a CPU limit is CFS
              # quota, and a JVM whose GC or JIT threads are suspended mid-slice stalls far worse
              # than the limit saves.
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kinowo
spec:
  ports:
    - name: health
      port: 9000
      targetPort: health
      # A FIXED PORT, because infra/nix/files/monitoring/scrape-kinowo-apps.yaml names it. An
      # allocated one would change on re-create and the scrape would silently go stale. 30900-30902
      # are pl/de/uk, so this is the next free one.
      nodePort: 30903
