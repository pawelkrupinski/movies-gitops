# THE COUNTRY'S OWN VALUES. Four things differ between the three workers and they are all here.
#
# EVERY DOCUMENT CARRIES `namespace: kinowo`, and it is not decoration: the base sets that
# namespace, so a patch without it matches nothing and kustomize fails with
# "no resource matches strategic merge patch ... [noNs]" -- which reads like the resource is
# missing rather than like the selector is under-specified.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-env
  namespace: kinowo
data:
  # THE ONE VALUE THAT MAKES THIS THE POLAND WORKER, and also what selects the
  # database: Country.mongoDb derives it from the country, so this alone sends writes to the right
  # corpus. MONGODB_DB is never set -- it would override that and merge all three.
  KINOWO_COUNTRIES: "pl"

  # Identity migration: run the new resolver in SHADOW (from its TMDB store, no network), writing
  # identity_shadow_decisions / identity_shadow_diff (8-day TTL) for /admin/identity and the
  # old-vs-new gauges. Decides nothing served. ES/DE ticks: 3-11 s, heap ~200 MB of 433-649 MB.
  # On again 2026-09-28 ~20:10 UTC: app 5e67977ba broke PL's one 6.6k-listing family apart (largest
  # now 1,338), so a full build of the PL recording takes 23 s (was 269 s), its slowest region
  # 2.7 s (was 94 s), the model ~35 MB; 12964a7a3 lets take-up reads run in parallel.
  KINOWO_IDENTITY_SHADOW: "true"
  # After each shadow tick, ask TMDB what the model's TMDB store cannot answer yet, paced at
  # KINOWO_IDENTITY_SHADOW_LOOKUP_RATE (default 60/min; halves on 429/5xx); answers go only to
  # that store. Proven in ES since 2026-09-26 (13k answers, 0 throttled, heap fine) — without it the
  # shadow leaves most films "moved" (unanswered), so the cutover gate's ≥97% identical is unreachable.
  KINOWO_IDENTITY_SHADOW_LOOKUPS: "true"
  # 300/min: 5 req/s per worker, 25 across the five — half TMDB's ~50 req/s. At the 60/min default
  # the fill trailed by ~9 h on 2026-09-28 (UK 34k, PL 15k lookups unanswered), holding the shadow's
  # identical share at 62-84%. The pipeline's lookup chain still paces every host, venue pages included.
  KINOWO_IDENTITY_SHADOW_LOOKUP_RATE: "300"

  # Identity phase 4: compare sampled slots/screenings' listingKey with today's slot key and report
  # disagreements (gauge + capped log). Read-only; a week of full agreement gates the first dual read.
  KINOWO_LISTING_KEY_SHADOW_READ: "true"

  # The dominant write-rate lever: how stale a cinema's scrape may get before it is re-scraped.
  KINOWO_SCRAPE_FRESHNESS_MINUTES: "60"

  # Identical to the other countries except the heap. Carried from Fly verbatim: SerialGC and a
  # small pinned heap were the fix for an OOM-restart loop under G1, and re-tuning them is a
  # separate change from moving the process.
  # MaxMetaspaceSize back to 128m (2026-09-29, after a 192m stopgap that morning): PL died of
  # OutOfMemoryError: Metaspace at its 128m cap four times on 09-28/29 with every class in metaspace.
  # The image's AOT cache now serves the classes production loads (aot-classes.txt), and PL's
  # metaspace sits at ~35 MB (VITALS, 12:40 UTC) — the cap is back to a ceiling, not a limit.
  JAVA_OPTS: >-
    -Xms448m -Xmx448m -XX:+UseSerialGC -XX:+UseStringDeduplication -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=96m -XX:CICompilerCount=2 -XX:-UseTypeSpeculation -XX:PerMethodRecompilationCutoff=20 -XX:PerBytecodeRecompilationCutoff=20 -XX:NativeMemoryTracking=summary -XX:+UnlockDiagnosticVMOptions -XX:+PrintNMTStatistics -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/heapdumps -XX:ErrorFile=/data/logs/hs_err_%p.log -Djdk.http.auth.tunneling.disabledSchemes=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kinowo
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              # MEASURED, not guessed. Every pod on this node used to reserve a round
              # number -- a whole core per worker, 500m per web -- and the sum reached 97% of the
              # node's 8 allocatable cores while the box itself idled at 16%. The scheduler admits
              # on REQUESTS, so that left 240m free and no room for the extra pod a rolling update
              # surges: web-es sat Pending and Spain served the wrong image until its old pod was
              # deleted by hand. These numbers come from `max_over_time` of each pod's own
              # `process_cpu_seconds_total` over 24h. `NodeCpuBudgetSpec` holds the sum.
              # pl worker peaked at 0.31 cores: the shortest cadence in the fleet
              # (60min) over the smallest roster.
              cpu: "500m"
              # MEMORY IS MEASURED THE SAME WAY. `max_over_time(process_resident_memory_bytes[7d])`
              # put worker pl at 800Mi on 2026-09-07; this sits above that peak with headroom
              # rather than at the round worker default, which reserved surge budget it never
              # touched. The limit below is unchanged -- only the SCHEDULER's number moves.
              memory: 960Mi
            limits:
              # The limit is the OOM CEILING; the request above is what the SCHEDULER reserves.
              # They are no longer equal, and this was never Guaranteed QoS whatever an earlier
              # note here claimed: there is deliberately NO CPU limit -- a CPU limit is CFS quota,
              # and a JVM whose GC or JIT threads are suspended mid-slice stalls far worse than
              # the limit saves -- and a container without one is Burstable however its memory is
              # written. So eviction safety comes from the REQUEST SITTING ABOVE THE MEASURED
              # PEAK, not from the limit matching it: the kubelet ranks Burstable pods by how far
              # past their own request they have gone. `NodeMemoryBudgetSpec` holds both bounds.
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kinowo
spec:
  ports:
    - name: health
      port: 9000
      targetPort: health
      # A FIXED PORT, because infra/nix/files/monitoring/scrape-kinowo-apps.yaml names it. An
      # allocated one would change on re-create and the scrape would silently go stale.
      nodePort: 30900
